name: projekt-docker-cloud

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: projekt_proxy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: projekt-docker-backend:${APP_VERSION:-1.0.0}
    container_name: projekt_backend
    environment:
      APP_NAME: "${APP_NAME:-Tasks API}"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-tasksdb}"
      DB_USER: "${POSTGRES_USER:-tasksuser}"
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL_SECONDS: "${REDIS_TTL_SECONDS:-30}"
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: projekt_db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tasksdb}"
      POSTGRES_USER: "${POSTGRES_USER:-tasksuser}"
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: projekt_redis
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:-./secrets/db_password.txt.example}
